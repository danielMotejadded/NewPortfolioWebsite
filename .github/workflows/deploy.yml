name: 🚀 Deploy to home.pl

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout repo
        uses: actions/checkout@v4

      - name: 📂 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOMEPL_SERVER }}
          username: ${{ secrets.HOMEPL_USERNAME }}
          password: ${{ secrets.HOMEPL_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /public_html/Portfolio/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            README.md
            .github/**